      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
          description: ''
    post:
      operationId: workspaces_channels_create
      summary: Create a channel
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/:
    get:
      operationId: workspaces_channels_retrieve
      summary: One channel
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    patch:
      operationId: workspaces_channels_partial_update
      summary: Rename, change the topic, archive or unarchive
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannelUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/files/:
    post:
      operationId: workspaces_channels_files_create
      summary: Upload a file to attach to your next message in this channel
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/join/:
    post:
      operationId: workspaces_channels_join_create
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/leave/:
    post:
      operationId: workspaces_channels_leave_create
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{slug}/channels/{channel_id}/members/:
    get:
      operationId: workspaces_channels_members_list
      summary: Who is in it
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelMember'
          description: ''
    post:
      operationId: workspaces_channels_members_create
      summary: Add a workspace member to the channel
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChannelMemberRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMember'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/messages/:
    get:
      operationId: workspaces_channels_messages_retrieve
      summary: Message history, or catch-up after a reconnect
      parameters:
      - in: query
        name: after_event
        schema:
          type: integer
        description: 'Catch up: everything changed after this event, oldest first.'
      - in: query
        name: before
        schema:
          type: integer
        description: 'Older messages: seq below this.'
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: workspaces_channels_messages_create
      summary: Send a message
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/messages/{seq}/:
    patch:
      operationId: workspaces_channels_messages_partial_update
      description: Edit and delete, for a message found by `_message`.
      summary: Edit your message
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: seq
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBodyRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: workspaces_channels_messages_destroy
      description: Edit and delete, for a message found by `_message`.
      summary: Delete a message
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: seq
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/messages/{seq}/reactions/:
    post:
      operationId: workspaces_channels_messages_reactions_create
      summary: React to a message or reply with an emoji
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: seq
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
