      operationId: workspaces_list
      summary: My workspaces
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: workspaces_create
      summary: Create a workspace
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/:
    get:
      operationId: workspaces_retrieve
      summary: One workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    patch:
      operationId: workspaces_partial_update
      summary: Rename a workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/audit/:
    get:
      operationId: workspaces_audit_retrieve
      summary: Audit log, newest first
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: From `next` of the previous page.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
  /api/v1/workspaces/{slug}/channels/:
    get:
