openapi: 3.0.3
info:
  title: Baithak API
  version: 0.1.0
paths:
  /api/v1/auth/availability/:
    post:
      operationId: auth_availability_create
      description: |-
        Live checks for the sign-up form.

        This tells anyone whether an email has an account, which sign-up itself never does; the
        tight throttle is what keeps it from being a list of members.
      summary: Is this email or handle free?
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequestRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
          description: ''
  /api/v1/auth/config/:
    get:
      operationId: auth_config_retrieve
      summary: Public settings for auth forms
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/v1/auth/csrf/:
