          minLength: 1
          maxLength: 40
        color:
          $ref: '#/components/schemas/ColorEnum'
    PatchedNotificationSettingsRequest:
      type: object
      properties:
        notify_by_email:
          type: boolean
        quiet_start:
          type: string
          format: time
          nullable: true
        quiet_end:
          type: string
          format: time
          nullable: true
        time_zone:
          type: string
          minLength: 1
          description: An IANA name, like Asia/Karachi.
          maxLength: 64
    PatchedProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        archived:
          type: boolean
    PatchedRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedWorkspaceWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    PriorityEnum:
      enum:
      - none
      - low
      - medium
      - high
      - urgent
      type: string
      description: |-
        * `none` - none
        * `low` - low
        * `medium` - medium
        * `high` - high
        * `urgent` - urgent
    Project:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        archived:
          type: boolean
          readOnly: true
        open_issues:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived
      - created_at
      - description
      - key
      - name
      - open_issues
    ProjectCreateRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          description: 2 to 10 letters or digits; KEY-12.
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
      required:
      - key
      - name
    Reaction:
      type: object
      properties:
        emoji:
          type: string
        count:
          type: integer
        users:
          type: array
          items:
            $ref: '#/components/schemas/Author'
      required:
      - count
      - emoji
      - users
    ReadMarker:
      type: object
      properties:
        channel:
          type: integer
        last_read_seq:
          type: integer
        unread:
          type: integer
          nullable: true
      required:
      - channel
      - last_read_seq
      - unread
    ReadRequest:
      type: object
      properties:
        seq:
          type: integer
          minimum: 0
      required:
      - seq
    ReplyRequest:
      type: object
      properties:
        body:
          type: string
          default: ''
          maxLength: 4000
        client_id:
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: string
            maxLength: 0
        attachments:
          type: array
          items:
            type: integer
          description: Ids of files you uploaded to this channel and haven't sent
            yet.
          maxItems: 10
        also_in_channel:
          type: boolean
          default: false
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      - guest
      type: string
      description: |-
        * `owner` - owner
        * `admin` - admin
        * `member` - member
        * `guest` - guest
    SendRequest:
      type: object
      properties:
        body:
          type: string
          default: ''
          maxLength: 4000
        client_id:
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: string
            maxLength: 0
        attachments:
          type: array
          items:
            type: integer
          description: Ids of files you uploaded to this channel and haven't sent
            yet.
          maxItems: 10
    SignInRequest:
      type: object
      properties:
        captcha:
          type: string
          maxLength: 4000
        captcha_v2:
          type: string
          maxLength: 4000
        website:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    SignUpRequest:
      type: object
      properties:
        captcha:
          type: string
          maxLength: 4000
        captcha_v2:
          type: string
          maxLength: 4000
        website:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        username:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9_.-]{1,29}$
          maxLength: 30
        display_name:
          type: string
          maxLength: 80
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
      - username
    StatusEnum:
      enum:
      - backlog
      - todo
      - in_progress
      - done
      - canceled
      type: string
      description: |-
        * `backlog` - backlog
        * `todo` - todo
        * `in_progress` - in_progress
        * `done` - done
        * `canceled` - canceled
    ThreadPage:
      type: object
      properties:
        parent:
          $ref: '#/components/schemas/Message'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
      required:
      - has_more
      - parent
      - replies
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
    UidTokenRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
      - uid
    Unread:
      type: object
      properties:
        unread:
          type: integer
      required:
      - unread
    UploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - display_name
      - email
      - email_verified
      - id
      - username
    Workspace:
      type: object
      description: 'A workspace as seen by one member: built from that member''s row.'
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - created_at
      - name
      - role
      - slug
    WorkspaceWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
