            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/messages/{seq}/reactions/{emoji}/:
    delete:
      operationId: workspaces_channels_messages_reactions_destroy
      summary: Take back your reaction
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: emoji
        schema:
          type: string
        required: true
      - in: path
        name: seq
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
