  /api/v1/workspaces/{slug}/search/messages/:
    get:
      operationId: workspaces_search_messages_retrieve
      summary: Search messages you can read, newest first
      parameters:
      - in: query
        name: after
        schema:
          type: string
          format: date
        description: On or after this day.
      - in: query
        name: author
        schema:
          type: string
          minLength: 1
          maxLength: 30
        description: A @handle.
      - in: query
        name: before
        schema:
          type: string
          format: date
        description: On or before this day.
      - in: query
        name: before_id
        schema:
          type: integer
        description: 'The next page: `next` from the last.'
      - in: query
        name: channel
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Words to find, each as a prefix.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResults'
          description: ''
