      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/invitations/{invitation_id}/:
    delete:
      operationId: workspaces_invitations_destroy
      summary: Revoke an invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/members/:
    get:
      operationId: workspaces_members_list
      summary: Workspace members
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/workspaces/{slug}/members/{user_id}/:
    patch:
      operationId: workspaces_members_partial_update
      summary: Change a member's role
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: workspaces_members_destroy
      summary: Remove a member, or leave
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    AddChannelMemberRequest:
      type: object
      properties:
        user_id:
          type: integer
      required:
      - user_id
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: string
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        changes:
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - at
      - changes
      - id
      - model
      - object_id
    AuditPage:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
      required:
      - next
      - previous
      - results
    AuthConfig:
      type: object
      properties:
        recaptcha_v3_site_key:
          type: string
        recaptcha_v2_site_key:
          type: string
      required:
      - recaptcha_v2_site_key
      - recaptcha_v3_site_key
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - username
    Availability:
      type: object
      properties:
        available:
          type: boolean
        message:
          type: string
      required:
      - available
      - message
    AvailabilityRequestRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        username:
          type: string
          maxLength: 60
    AvailabilityResult:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Availability'
        username:
          $ref: '#/components/schemas/Availability'
    CaptchaEnum:
      enum:
      - v2
      type: string
      description: '* `v2` - v2'
    CaptchaError:
      type: object
      properties:
        detail:
          type: string
        captcha:
          $ref: '#/components/schemas/CaptchaEnum'
      required:
      - detail
    Channel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        topic:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        archived:
          type: boolean
          readOnly: true
        is_member:
          type: boolean
          readOnly: true
        last_seq:
          type: integer
          readOnly: true
        last_read_seq:
          type: integer
          readOnly: true
          nullable: true
        unread:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived
      - created_at
      - id
      - is_default
      - is_member
      - kind
      - last_read_seq
      - last_seq
      - name
      - topic
      - unread
    ChannelCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9_-]{0,79}$
          maxLength: 81
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: public
        topic:
          type: string
          maxLength: 250
      required:
      - name
    ChannelMember:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - display_name
      - joined_at
      - user_id
      - username
    ContactRequest:
      type: object
      properties:
        captcha:
          type: string
          maxLength: 4000
        captcha_v2:
          type: string
          maxLength: 4000
        website:
          type: string
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        message:
          type: string
          minLength: 10
          maxLength: 5000
      required:
      - email
      - message
      - name
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailRequest:
      type: object
      properties:
        captcha:
          type: string
          maxLength: 4000
        captcha_v2:
          type: string
          maxLength: 4000
        website:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    InvitableRoleEnum:
      enum:
      - admin
      - member
      - guest
      type: string
      description: |-
        * `admin` - admin
        * `member` - member
        * `guest` - guest
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        invited_by:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
    InvitationPreview:
      type: object
      properties:
        workspace:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        invited_by:
          type: string
          nullable: true
        email:
          type: string
          description: The invited address, masked.
      required:
      - email
      - invited_by
      - role
      - workspace
    InviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/InvitableRoleEnum'
      required:
      - email
      - role
    KindEnum:
      enum:
      - public
      - private
      type: string
      description: |-
        * `public` - public
        * `private` - private
    Member:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - display_name
      - joined_at
      - role
      - user_id
      - username
    Message:
      type: object
      description: Needs `author` and `parent` loaded (select_related) to avoid a
        query per message.
      properties:
        id:
          type: integer
          readOnly: true
        seq:
          type: integer
          readOnly: true
          nullable: true
        event:
          type: integer
          readOnly: true
        parent_seq:
          type: integer
          readOnly: true
          nullable: true
          description: The thread's seq.
        thread_seq:
          type: integer
          readOnly: true
          nullable: true
        also_in_channel:
          type: boolean
          readOnly: true
        reply_count:
          type: integer
          readOnly: true
        last_reply_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        author:
          allOf:
          - $ref: '#/components/schemas/Author'
          readOnly: true
          nullable: true
        body:
          type: string
          readOnly: true
        client_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        deleted:
          type: boolean
          readOnly: true
      required:
      - also_in_channel
      - author
      - body
      - client_id
      - created_at
      - deleted
      - edited_at
      - event
      - id
      - last_reply_at
      - parent_seq
      - reply_count
      - seq
      - thread_seq
    MessagePage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
        last_seq:
          type: integer
        last_event:
          type: integer
      required:
      - has_more
      - last_event
      - last_seq
      - messages
    PasswordResetConfirmRequest:
      type: object
      description: 'The code from the email, and who it is for: `uid` from the emailed
        link, or `email`.'
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 1
          pattern: ^\d{6}$
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - code
      - password
    PatchedBodyRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
    PatchedChannelUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9_-]{0,79}$
          maxLength: 81
        topic:
          type: string
          maxLength: 250
        archived:
          type: boolean
    PatchedRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedWorkspaceWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    ReadMarker:
      type: object
      properties:
        channel:
          type: integer
        last_read_seq:
          type: integer
        unread:
          type: integer
          nullable: true
      required:
      - channel
      - last_read_seq
      - unread
    ReadRequest:
      type: object
      properties:
        seq:
          type: integer
          minimum: 0
      required:
      - seq
    ReplyRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        client_id:
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: string
            maxLength: 0
        also_in_channel:
          type: boolean
          default: false
      required:
      - body
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      - guest
      type: string
      description: |-
        * `owner` - owner
        * `admin` - admin
        * `member` - member
        * `guest` - guest
    SendRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        client_id:
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: string
            maxLength: 0
      required:
      - body
    SignInRequest:
      type: object
      properties:
        captcha:
          type: string
          maxLength: 4000
        captcha_v2:
          type: string
          maxLength: 4000
        website:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    SignUpRequest:
      type: object
      properties:
        captcha:
          type: string
          maxLength: 4000
        captcha_v2:
          type: string
          maxLength: 4000
        website:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        username:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9_.-]{1,29}$
          maxLength: 30
        display_name:
          type: string
          maxLength: 80
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
      - username
    ThreadPage:
      type: object
      properties:
        parent:
          $ref: '#/components/schemas/Message'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
      required:
      - has_more
      - parent
      - replies
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
    UidTokenRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
      - uid
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - display_name
      - email
      - email_verified
      - id
      - username
    Workspace:
      type: object
      description: 'A workspace as seen by one member: built from that member''s row.'
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - created_at
      - name
      - role
      - slug
    WorkspaceWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
