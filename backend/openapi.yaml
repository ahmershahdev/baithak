      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/workspaces/{slug}/channels/{channel_id}/messages/{seq}/replies/:
    get:
      operationId: workspaces_channels_messages_replies_retrieve
      summary: 'A thread: its first message and replies, oldest first'
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: Replies after this thread_seq.
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: seq
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
