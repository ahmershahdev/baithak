          description: ''
    post:
      operationId: workspaces_channels_messages_replies_create
      summary: Reply in a thread
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: path
        name: seq
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
