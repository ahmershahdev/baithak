name: baithak

# Every default below is for local development only. Put overrides in .env (see .env.example).
x-mysql-env: &mysql-env
  MYSQL_DATABASE: ${MYSQL_DATABASE:-baithak}
  MYSQL_USER: ${MYSQL_USER:-baithak}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-baithak}

x-backend: &backend
  build:
    context: ./backend
    args:
      DEV: "true"
  environment:
    <<: *mysql-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-a-secret}
    MYSQL_HOST: mysql
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/2
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RECAPTCHA_V3_SITE_KEY: ${RECAPTCHA_V3_SITE_KEY:-}
    RECAPTCHA_V3_SECRET_KEY: ${RECAPTCHA_V3_SECRET_KEY:-}
    RECAPTCHA_V2_SITE_KEY: ${RECAPTCHA_V2_SITE_KEY:-}
    RECAPTCHA_V2_SECRET_KEY: ${RECAPTCHA_V2_SECRET_KEY:-}
    CELERY_BROKER_URL: redis://redis:6379/1
    CLAMAV_HOST: clamav
  volumes:
    - ./backend:/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4.13
    environment:
      <<: *mysql-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend
    # --beat runs the schedule (CELERY_BEAT_SCHEDULE) in this one worker; production runs a
    # separate beat so a second worker can't start a second schedule.
    # "scan" is the virus scanning queue (CELERY_TASK_ROUTES); production can give it its own
    # workers.
    command: ["celery", "-A", "config", "worker", "--beat", "--loglevel=info", "--concurrency=2", "-Q", "celery,scan"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: its first signature download takes minutes, and scans retry
      # until it answers.
      clamav:
        condition: service_started

  clamav:
    image: clamav/clamav:1.5.5
    environment:
      # Refuse what can't be fully checked: archives over the scan limits, and encrypted
      # archives or documents (docs/architecture.md, Files).
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_StreamMaxLength: 30M
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  mysql-data:
  clamav-db:
